spring:
  application:
    name: med-rms
  profiles:
    # P0-3 修复：删除默认 dev，必须由运维显式注入 SPRING_PROFILES_ACTIVE
    active: ${SPRING_PROFILES_ACTIVE:}
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:med_rms_pms}?useUnicode=true&characterEncoding=utf-8
    username: ${DB_USERNAME:postgres}
    # CODE_REVIEW L-6：默认口令 postgres 仅用于本地 dev。生产必须通过环境变量 DB_PASSWORD 注入强口令，
    # 否则等于数据库裸奔。建议生产 profile 强制无缺省：${DB_PASSWORD}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000
  # R226.6 INTEG-006：spring.redis → spring.data.redis（SB 3.x 已弃用 spring.redis.*）
  data:
    redis:
      host: localhost
      port: 6379
      password:
      database: 0
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 5
  # Flyway 数据库迁移自动化（v1.70）
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration
    table: flyway_schema_history
    baseline-description: "Med-RMS v1.70 Flyway 启用（保留现有 DDL）"
  # v1.43 P1-6 修复：附件上传支持
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 100MB

med-rms:
  attachment:
    storage-path: ${java.io.tmpdir}/med-rms-attachments
  # R223.1: JWT 密钥外部化（环境变量 MED_RMS_JWT_SECRET / JWT_SECRET；dev profile 缺省用 DEFAULT_DEV_SECRET）
  jwt:
    secret: ${MED_RMS_JWT_SECRET:${JWT_SECRET:}}

server:
  port: 8080
  servlet:
    context-path: /api

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.zhutao.medrms.**.domain.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: isDeleted
      logic-delete-value: true
      logic-not-delete-value: false

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

# Flyway 配置已移至 application.yml 顶部 spring.flyway 块（v1.70 起）
# R226.6 INTEG-005：删除下方悬空的重复 flyway 块（解析时被忽略，但易误导维护者）

logging:
  level:
    root: INFO
    com.zhutao.medrms: DEBUG          # dev: DEBUG, prod: INFO（见 application-prod.yml）
    com.baomidou.mybatisplus: DEBUG  # dev: DEBUG, prod: WARN
  file:
    # CODE_REVIEW L-7：移除 Windows 硬编码 C:/temp，改用相对路径 + 环境变量覆盖（跨平台）
    name: ${LOG_DIR:./logs}/medrms-app.log

# R220 v1.76: 合规功能 Feature Flag
# 当前禁用电子签名（用户决策）。恢复方式：改 true
compliance:
  modules:
    signature: false

# W22 Actuator 可观测性
# CODE_REVIEW I-2：默认仅暴露 health/info/metrics，mappings/beans 仅在 dev 暴露（含完整端点映射与 bean 定义，易泄露内部实现）
management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics
      base-path: /actuator
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
  info:
    env:
      enabled: false

---
spring:
  config:
    activate:
      on-profile: dev
# dev 环境额外暴露 mappings/beans 便于调试（生产默认不暴露）
management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, mappings, beans